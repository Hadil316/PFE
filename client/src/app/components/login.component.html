<div style="height:100vh;width:100vw;overflow:hidden;font-family:sans-serif;" class="flex flex-col selection:bg-sky-100">

  <main class="flex-1 relative flex flex-col h-full">

    <!-- Background fixe -->
    <div class="absolute inset-0 z-0">
      <img src="assets/industrial-bg.png" alt="background" class="w-full h-full object-cover" />
      <div class="absolute inset-0" style="background: linear-gradient(to right, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.60) 50%, transparent 100%);"></div>
    </div>

    <!-- LOGO EMS VOLT + badge Monitoring -->
    <div class="absolute top-6 left-6 lg:top-10 lg:left-12 z-50" style="display:flex;flex-direction:column;gap:12px;">
      <!-- Ligne logo -->
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:40px;height:40px;background:linear-gradient(135deg,#0ea5e9,#0369a1);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(14,165,233,0.4);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M13 2L4.5 13.5H11L10 22L19.5 10.5H13L13 2Z" fill="#38bdf8" stroke="#7dd3fc" stroke-width="0.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <div style="display:flex;align-items:baseline;gap:6px;">
          <span style="font-size:20px;font-weight:900;color:#ffffff;letter-spacing:0.04em;line-height:1;">EMS</span>
          <span style="font-size:20px;font-weight:700;color:#38bdf8;letter-spacing:0.08em;line-height:1;">VOLT</span>
        </div>
      </div>
      <!-- Badge Monitoring juste en dessous -->
      <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(14,165,233,0.20);border:1px solid rgba(14,165,233,0.30);backdrop-filter:blur(12px);width:fit-content;">
        <span style="width:7px;height:7px;border-radius:50%;background:#38bdf8;display:inline-block;animation:pulse 2s infinite;"></span>
        <span style="font-size:10px;font-weight:700;color:#38bdf8;text-transform:uppercase;letter-spacing:0.12em;">Monitoring Industriel</span>
      </div>
    </div>

    <!-- Contenu principal -->
    <div class="relative z-10 flex-1 flex flex-col lg:flex-row items-center px-8 lg:px-24 py-12 lg:py-0 w-full h-full">

      <!-- LEFT TEXT -->
      <div class="flex-1 text-white space-y-6 mb-12 lg:mb-0 lg:pr-12" style="margin-top:140px;">

        <h2 class="font-black tracking-tight" style="font-size:clamp(36px,4.5vw,56px);line-height:1.2;">
          Optimisez votre
          <span style="background:linear-gradient(to right,#38bdf8,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Énergie</span>
          en temps réel.
        </h2>

        <p class="text-lg max-w-xl leading-relaxed" style="color:#cbd5e1;">
          Connectez-vous à la plateforme EMS la plus avancée. Visualisez, analysez et contrôlez vos actifs industriels en un clic.
        </p>
      </div>

      <!-- CARD — tout en inline style pour contourner Angular ViewEncapsulation -->
      <div class="w-full" style="max-width:480px;animation:floatCard 3.5s ease-in-out infinite alternate;">
        <div style="
          background: linear-gradient(135deg, rgba(14,165,233,0.22) 0%, rgba(56,189,248,0.12) 50%, rgba(2,132,199,0.18) 100%);
          backdrop-filter: blur(28px) saturate(200%) brightness(1.15);
          -webkit-backdrop-filter: blur(28px) saturate(200%) brightness(1.15);
          border-radius: 28px;
          border: 1px solid rgba(125,211,252,0.40);
          border-top-color: rgba(186,230,253,0.55);
          box-shadow:
            0 0 0 1px rgba(14,165,233,0.10),
            0 8px 32px rgba(2,132,199,0.30),
            0 32px 64px rgba(0,0,0,0.40),
            inset 0 1px 0 rgba(186,230,253,0.45);
          padding: 48px;
          position: relative;
          overflow: hidden;
        ">

          <!-- Reflet haut de carte -->
          <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(186,230,253,0.7) 30%,rgba(125,211,252,0.9) 50%,rgba(186,230,253,0.7) 70%,transparent 100%);"></div>
          <!-- Lueur interne coin haut-gauche -->
          <div style="position:absolute;top:-60px;left:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(56,189,248,0.14) 0%,transparent 70%);border-radius:50%;pointer-events:none;"></div>

          <!-- Titre -->
          <div style="margin-bottom:36px;">
            <h3 style="font-size:22px;font-weight:900;color:#ffffff;letter-spacing:-0.02em;">Accès Client</h3>
            <p style="color:rgba(186,230,253,0.70);font-size:13px;margin-top:8px;">Veuillez entrer vos identifiants pour continuer.</p>
          </div>

          <!-- FORM -->
          <form (ngSubmit)="login()" style="display:flex;flex-direction:column;gap:20px;">

            <!-- Email -->
            <div>
              <label style="display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:#bae6fd;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:8px;">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                Email
              </label>
              <div style="position:relative;background:rgba(14,165,233,0.12);border-radius:14px;border:1px solid rgba(125,211,252,0.22);">
                <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#7dd3fc;">
                  <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                </span>
                <input
                  type="email"
                  [(ngModel)]="email"
                  name="email"
                  placeholder="email@entreprise.com"
                  style="width:100%;padding:15px 20px 15px 48px;background:transparent;border:none;border-radius:10px;font-size:14px;font-weight:500;color:#ffffff;outline:none;box-sizing:border-box;"
                />
              </div>
            </div>

            <!-- Mot de passe -->
            <div>
              <label style="display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:#bae6fd;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:8px;">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                Mot de passe
              </label>
              <div style="position:relative;background:rgba(14,165,233,0.12);border-radius:14px;border:1px solid rgba(125,211,252,0.22);">
                <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#7dd3fc;">
                  <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </span>
                <input
                  type="password"
                  [(ngModel)]="password"
                  name="password"
                  placeholder="••••••••"
                  style="width:100%;padding:15px 20px 15px 48px;background:transparent;border:none;border-radius:10px;font-size:14px;font-weight:500;color:#ffffff;outline:none;box-sizing:border-box;"
                />
              </div>
            </div>

            <!-- Erreur -->
            <div *ngIf="errorMessage()" style="color:#f87171;font-size:12px;display:flex;align-items:center;gap:6px;">
              <span>⚠</span> {{ errorMessage() }}
            </div>

            <!-- Bouton -->
            <button
              type="submit"
              [disabled]="isLoading()"
              style="width:100%;background:linear-gradient(135deg,#0ea5e9 0%,#0284c7 100%);color:white;padding:18px 24px;border-radius:14px;font-weight:800;font-size:14px;border:none;cursor:pointer;box-shadow:0 10px 25px -5px rgba(14,165,233,0.45),inset 0 1px 0 rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.3s;"
            >
              <span *ngIf="!isLoading()">Se connecter au Dashboard →</span>
              <div *ngIf="isLoading()" style="width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            </button>

          </form>
        </div>
      </div>

    </div>
  </main>

</div>

<!-- Keyframes injectés ici — visibles globalement, non scopés par Angular -->
<style>
  @keyframes floatCard {
    0%   { transform: translateY(0px); }
    100% { transform: translateY(-10px); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  input[type="email"]::placeholder,
  input[type="password"]::placeholder {
    color: rgba(125, 211, 252, 0.55) !important;
  }
</style>
